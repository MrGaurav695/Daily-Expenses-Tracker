<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>
  <link rel="icon" href="img/z.png" >
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Expense Tracker</h2>
    <form id="expenseForm" autocomplete="off">
      <input type="text" id="description" placeholder="Expense Description" required />
      <select id="category" required>
        <option value="" disabled selected>Select Category</option>
        <option value="Food">Food</option>
        <option value="Transportation">Transportation</option>
        <option value="Utilities">Utilities</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Others">Others</option>
      </select>
      <input type="text" id="customCategory" placeholder="Enter custom category" style="display:none;" />
      <input type="number" id="amount" placeholder="Amount (e.g. 2500.50)" min="0.01" step="0.01" required />
      <input type="submit" value="Add Expense" />
    </form>

    <h3>Expense Summary</h3>
    <table id="expenseTable" aria-label="Expense summary table">
      <thead>
        <tr>
          <th>Description</th>
          <th>Category</th>
          <th>Amount (₹)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="expenseList"></tbody>
      <tfoot>
        <tr>
          <td colspan="2">Total</td>
          <td id="totalAmount">₹0.00</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
